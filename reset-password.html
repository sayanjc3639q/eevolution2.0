<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | EEvolution 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1rem;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--electric-blue);
            outline: none;
        }
    </style>
</head>

<body class="dark-theme auth-page">
    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2
                style="color: var(--electric-blue); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="ph ph-lightning"></i> EEvolution 2.0
            </h2>
        </div>

        <form id="reset-password-form">
            <h3 style="margin-bottom: 1.5rem;">Set New Password</h3>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;"
                id="btn-update">Update Password <i class="ph ph-check"></i></button>
        </form>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-update');

            btn.disabled = true;
            btn.innerHTML = 'Updating... <i class="ph ph-spinner ph-spin"></i>';

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                showToast("Error updating password: " + error.message, "error");
                btn.disabled = false;
                btn.innerHTML = 'Update Password <i class="ph ph-check"></i>';
            } else {
                showToast("Password updated successfully. You can now log in.", "success");
                setTimeout(() => {
                    window.location.href = "auth.html";
                }, 2000);
            }
        });
    </script>
</body>

</html>
