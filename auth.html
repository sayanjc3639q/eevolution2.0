<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authentication | EEvolution 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1rem;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--electric-blue);
            outline: none;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-switch a {
            color: var(--electric-blue);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="dark-theme auth-page">
    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2
                style="color: var(--electric-blue); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="ph ph-lightning"></i> EEvolution 2.0
            </h2>
            <p class="text-muted" style="margin-top: 0.5rem;">Access the Digital Hub</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <h3 style="margin-bottom: 1.5rem;">Welcome Back</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;" id="btn-login">Log
                In <i class="ph ph-sign-in"></i></button>
            <div class="auth-switch">
                <p>Don't have an account? <a onclick="toggleAuthForm('register-form')">Register</a></p>
                <p style="margin-top: 0.5rem;"><a onclick="toggleAuthForm('forgot-form')">Forgot Password?</a></p>
                <p style="margin-top: 1.5rem;"><a href="index.html"><i class="ph ph-arrow-left"></i> Return Home</a></p>
            </div>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
            <h3 style="margin-bottom: 1.5rem;">Create Account</h3>
            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="reg-roll" placeholder="25/EE/___" pattern="25/EE/\d{3}" required>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input id="user-name" type="text" placeholder="Your Name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;"
                id="btn-register">Register <i class="ph ph-user-plus"></i></button>
            <div class="auth-switch">
                <p>Already have an account? <a onclick="toggleAuthForm('login-form')">Log In</a></p>
            </div>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-form" class="auth-form">
            <h3 style="margin-bottom: 1rem;">Reset Password</h3>
            <p class="text-muted" style="font-size:0.85rem; margin-bottom: 1.5rem;">Enter your email to receive a
                password reset link.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="forgot-email" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;" id="btn-forgot">Send
                Reset Link <i class="ph ph-envelope-simple"></i></button>
            <div class="auth-switch">
                <p><a onclick="toggleAuthForm('login-form')"><i class="ph ph-arrow-left"></i> Back to Login</a></p>
            </div>
        </form>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth-pages.js"></script>
</body>

</html>
